# Token Times settings. Edit this file to change what the feed collects.

[feed]
retention_days = 7          # drop stories older than this
max_items = 250             # hard cap on stories kept in the feed
max_new_candidates = 220    # most new items sent to Claude per run (cost control)

[llm]
# Claude picks stories, merges duplicates and writes the summaries.
#
# backend = "claude-code" runs Claude Code (`claude -p`) on your Claude
#   subscription: your normal login on this computer, or the
#   CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`) on GitHub.
#   Each run uses a little of your plan's usage limits; no separate bill.
# backend = "api" uses the Claude API with ANTHROPIC_API_KEY (billed per token).
# If Claude can't run, the fetcher falls back to basic keyword filtering.
backend = "claude-code"
# claude-opus-5-5 writes best but uses your limits fastest;
# claude-sonnet-5-5 or claude-haiku-5-5 go further on the same plan.
model = "claude-sonnet-5-5"
effort = "low"              # low | medium | high
writer_batch_size = 8

[markets]
# Tech stocks to follow. Market stories (share moves, earnings, guidance,
# analyst calls) about these or other big tech companies go to the top of the
# feed while they are fresh, with a headline plus the reasoning behind it.
tickers = ["NVDA", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "AMD", "AVGO", "TSM",
           "ORCL", "PLTR", "ARM", "INTC", "MU", "CRWV", "ASML", "SMCI", "NFLX", "CRM"]
companies = ["Nvidia", "Apple", "Microsoft", "Alphabet", "Google", "Amazon", "Meta", "Tesla",
             "AMD", "Broadcom", "TSMC", "Oracle", "Palantir", "Arm Holdings", "Intel", "Micron",
             "CoreWeave", "ASML", "Super Micro", "Netflix", "Salesforce", "OpenAI", "Anthropic",
             "xAI", "SoftBank", "Samsung", "SK Hynix"]
priority_hours = 36         # market stories stay pinned to the top for this long

[interests]
# Plain-language brief for the Claude editor. Rewrite it to taste.
text = """
- Highest priority: tech stock market news. Share-price moves, earnings, guidance, analyst calls, market-cap milestones and IPO trading for big tech and AI companies (Nvidia, Apple, Microsoft, Alphabet, Amazon, Meta, Tesla, AMD, Broadcom, TSMC, Oracle, Palantir and similar), and moves in tech or chip stocks as a group
- GitHub repos gaining lots of stars quickly, especially AI tools, agents and developer tooling
- New AI tools, coding agents, agent harnesses, Claude Code and Codex plugins, skills and MCP servers
- New models (frontier and open-weight), benchmarks, architectures and notable research papers
- AI politics: regulation, government policy, lawsuits, copyright, chips and export controls
- Major AI industry news: launches, funding, acquisitions, leadership changes
Skip: minor version bumps, listicles, SEO filler, crypto, stock-picking advice ("is X a buy?", "fairly valued?"), price predictions, generic tech news with no AI or market angle.
"""

[sources]
hn_min_points = 60            # Hacker News stories below this are ignored
github_new_min_stars = 150    # new repos (created in the last 7 days) need this many stars
github_topic_min_stars = 40   # repos found through the topics below
github_topics = ["llm", "ai-agents", "mcp", "claude-code", "agent-skills"]
hf_paper_min_upvotes = 8      # Hugging Face daily papers
rss_max_age_hours = 48        # ignore feed entries older than this

# match decides which entries of a feed are kept:
#   "all"  every entry (the feed is already on topic)
#   "ai"   entries that mention AI
#   "tech" entries that mention AI, a company in [markets], or tech/chip stocks

